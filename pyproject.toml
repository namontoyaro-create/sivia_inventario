[project]
name = "sivia-inventario"
version = "0.1.0"
description = "Sistema Inteligente de Vision Artificial para Inventarios"
authors = [
    {name = "Camila Montoya Romero",email = "namontoya@ucvvirtual.edu.pe"}
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "opencv-python (>=5.0.0.93,<6.0.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
