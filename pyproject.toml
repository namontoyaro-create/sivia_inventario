[project]
name = "sivia-inventario"
version = "0.1.0"
description = "Sistema Inteligente de Vision Artificial para Inventarios"
authors = [
    {name = "Camila Montoya Romero",email = "namontoya@ucvvirtual.edu.pe"}
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "opencv-python (>=5.0.0.93,<6.0.0.0)",
    "torch (>=2.14.1,<3.0.0)",
    "torchvision (>=0.29.1,<0.30.0)",
    "ultralytics (>=8.4.171,<9.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "fastapi (>=0.142.2,<0.143.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "sqlalchemy (>=2.1.1,<3.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
torch = {source = "pytorch-cpu"}
torchvision = {source = "pytorch-cpu"}
